name: Validate catch-all normalization on current main
on:
  push:
    branches: ['validation/codex24-repowise4574']
permissions:
  contents: read
env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact product
        run: git checkout 8d498283bf96fc8bf6373a7a0de90c01cf8c399a
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --python 3.12
      - name: Prove named catch-all regression on unchanged main
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          path = Path('packages/core/src/repowise/core/workspace/extractors/http/paths.py')
          fixed = path.read_bytes()
          try:
              path.write_bytes(subprocess.check_output(['git', 'show', '38870f588a611bd024fc58356a89d8134b69d356:packages/core/src/repowise/core/workspace/extractors/http/paths.py']))
              result = subprocess.run(['uv', 'run', 'pytest', 'tests/unit/workspace/test_contracts.py', '-q', '--junitxml=red.xml'], timeout=180)
              tree = ET.parse('red.xml')
              assert result.returncode == 1
              assert len(tree.findall('.//testcase/failure')) == 1
              assert not tree.findall('.//testcase/error')
              assert not tree.findall('.//testcase/skipped')
              failures = [c for c in tree.iter('testcase') if c.find('failure') is not None]
              assert failures[0].attrib['name'] == 'test_gin_echo_catchall_param'
          finally:
              path.write_bytes(fixed)
          PY
          git diff --exit-code
      - name: Focused normalization and matching
        run: uv run pytest tests/unit/workspace/test_contracts.py -q --junitxml=focused.xml
      - name: Both required Python suites
        run: uv run pytest tests/providers/ tests/unit/ -n 4 --dist loadfile -q --junitxml=green.xml
      - name: Full Ruff
        run: uv run ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run type-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catchall4574-evidence
          path: |
            red.xml
            focused.xml
            green.xml
