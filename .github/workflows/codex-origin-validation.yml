name: Validate Rocket BMS origin contribution
on:
  push:
    branches: ['validation/codex23-repowise4484']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --python 3.12
      - name: Prove regression on unchanged base
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          path = Path('packages/core/src/repowise/core/code_origin.py')
          fixed = path.read_bytes()
          try:
              path.write_bytes(subprocess.check_output(['git', 'show', '2328b587178774b5a5f712b6e6f6c57cfed9d8d6:packages/core/src/repowise/core/code_origin.py']))
              result = subprocess.run(['uv', 'run', 'pytest', 'tests/unit/test_code_origin.py', '-k', 'rocket_bms or painter_output', '-q', '--junitxml=red.xml'])
              tree = ET.parse('red.xml')
              assert result.returncode == 1
              assert len(tree.findall('.//testcase/failure')) == 4
              assert not tree.findall('.//testcase/error')
          finally:
              path.write_bytes(fixed)
          PY
      - name: Run both required Python suites
        run: uv run pytest tests/providers/ tests/unit/ -n 2 --dist loadfile -q --junitxml=green.xml
      - run: uv run ruff check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-evidence
          path: |
            red.xml
            green.xml
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run type-check
